<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Aktivasi GC-Ex</title>
<style>
:root{--bg:#e7e4dd;--sf:#f8f6f1;--sf2:#efece5;--bd:#d3cdc1;--tx:#2a2d31;--mu:#62656a;--pr:#2c3b57;--ac:#b5893e;--ok:#2f6b3a;--dn:#9b3d2f}
body.dh{--pr:#233a7e;--ac:#f0c047}
body.core{--pr:#22313f;--ac:#3b6ea5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 'Segoe UI',Tahoma,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:22px 24px}
h1{margin:0 0 2px;font-size:19px;color:var(--pr)}
.sub{color:var(--mu);margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin-bottom:4px}
.mid{display:flex;gap:8px;align-items:center}
.mid code{flex:1;font:700 20px/1.2 'Segoe UI',Tahoma,Arial,sans-serif;letter-spacing:.08em;color:var(--pr);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;text-align:center;user-select:all}
textarea{width:100%;height:92px;resize:vertical;font:12px/1.4 Consolas,'Segoe UI',monospace;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--tx)}
button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);cursor:pointer}
button.pri{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.msg{margin-top:8px;min-height:18px}
.msg.err{color:var(--dn)}.msg.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse}td{padding:3px 4px;vertical-align:top}td:first-child{color:var(--mu);width:38%}
.hint{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<div class="w">
  <h1 id="ttl">Aktivasi GC-Ex</h1>
  <div class="sub" id="sub">Aplikasi ini memerlukan kunci lisensi yang terikat ke komputer.</div>
  <div class="card" id="stat" style="display:none"></div>
  <div class="card">
    <div class="lab">ID Komputer ini</div>
    <div class="mid"><code id="mid">…</code><button id="cp">Salin</button></div>
    <div class="hint" style="margin-top:6px">Kirim ID ini ke penerbit lisensi GC-Ex. Anda akan menerima kunci lisensi (teks diawali <b>GCEX1.</b>) atau file <b>.gcexlic</b>.</div>
  </div>
  <div class="card">
    <div class="lab">Kunci lisensi</div>
    <textarea id="key" spellcheck="false" placeholder="Tempel kunci lisensi di sini (GCEX1....)"></textarea>
    <div class="row"><button id="file">Buka file .gcexlic…</button><button class="pri" id="go">Aktifkan</button></div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="row"><button id="rm" style="display:none">Hapus lisensi dari komputer ini</button><button id="close">Tutup</button></div>
</div>
<script src="activate.js"></script>
</body>
</html>
