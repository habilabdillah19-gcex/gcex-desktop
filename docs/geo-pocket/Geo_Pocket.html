<!DOCTYPE html>
<html lang="id" data-palet="keluarga" data-latar="hangat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geo Pocket — Peta &amp; Konverter Data Geologi/Tambang</title>
<style>:root{--chrome:#1C2733;--chrome2:#2C3B4B;--chrome-t:#ECE9E1;--panel:#F7F5F0;--bar:#EDEBE6;--line:#D3CDC1;--text:#1C2733;--sub:#5A636B;--accent:#17806B;--btn:#176F5D;--btn-h:#1C8467;--sel:#D5ECE4;--gold:#B5893E;--err:#B42318;--warn:#B45309;--bg1:#D9D6CC;--bg2:#EDEBE5;--bg3:#F8F6F1}
[data-palet=oksida]{--accent:#BC541D;--btn:#A8481A;--btn-h:#B8521C;--sel:#F3E0D3}
[data-palet=kuarsa]{--accent:#8C6E0F;--btn:#7A600D;--btn-h:#8C6E0F;--sel:#F3EAC9}
[data-palet=azurit]{--accent:#2B5F9E;--btn:#24508A;--btn-h:#2B5F9E;--sel:#DBE7FB}
[data-palet=hitam]{--chrome:#111;--chrome2:#2a2a2a;--panel:#FAFAFA;--bar:#EEE;--line:#CCC;--text:#111;--sub:#555;--accent:#222;--btn:#222;--btn-h:#000;--sel:#E2E2E2;--gold:#666;--bg1:#DDD;--bg2:#EEE;--bg3:#FAFAFA}
[data-latar=terang]{--bg1:#F2F2F2;--bg2:#F8F8F8;--bg3:#FFF}
[data-latar=gelap]{--bg1:#1C2733;--bg2:#2A3746;--bg3:#3A4658}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--panel)}
button,input,select{font:inherit;color:inherit}
svg.ic{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;box-shadow:0 0 0 3px #fff}
#app{display:grid;grid-template-rows:28px 1fr 24px;height:100%}
/* menu bar */
#mbar{display:flex;align-items:stretch;background:var(--chrome);color:var(--chrome-t);padding:0 6px;user-select:none;position:relative;z-index:30}
#logo{display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.06em;padding:0 10px 0 4px;font-size:11px}
#logo b{background:var(--accent);color:#fff;border-radius:2px;padding:1px 5px;font-size:10px}
.mb{background:none;border:0;padding:0 10px;color:inherit;cursor:pointer;border-radius:0}
.mb:hover,.mb.on{background:var(--chrome2)}
#mright{margin-left:auto;display:flex;align-items:center;font-size:11px;opacity:.75;padding-right:6px}
.dd{position:absolute;min-width:200px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:2px;padding:3px 0;z-index:60;box-shadow:none}
.cmi{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 8px;cursor:pointer;white-space:nowrap;position:relative}
.cmi:hover{background:var(--sel)}.cmi.dis{color:#7B848C;pointer-events:none}
.cmi .ic0{width:16px;text-align:center;color:var(--accent)}.cmi .k{margin-left:auto;padding-left:24px;color:var(--sub);font-size:11px}
.cmi .arr{margin-left:auto;padding-left:16px;color:var(--sub)}
.cmi>.dd{display:none;left:100%;top:-4px}.cmi:hover>.dd{display:block}
.sep{height:1px;background:var(--line);margin:3px 0}
/* main */
#main{display:flex;min-height:0;position:relative}
.dock{display:flex;flex-direction:column;background:var(--panel);min-width:0;min-height:0}
#left{width:268px;border-right:1px solid var(--line)}#right{width:290px;border-left:1px solid var(--line)}
.dh{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;background:var(--bar);border-bottom:1px solid var(--line);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);flex:none}
.dh .sp{flex:1}.dh button{background:none;border:0;cursor:pointer;color:var(--sub);padding:0 3px;border-radius:2px}.dh button:hover{background:var(--line)}
#search{width:calc(100% - 12px);margin:6px;padding:3px 6px;border:1px solid var(--line);border-radius:2px;background:#fff;flex:none}
#tree{flex:1;overflow:auto;padding:0 0 8px}
.nd{display:flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;cursor:default;white-space:nowrap;min-height:22px}
.nd:hover{background:#ECE8DD}.nd.sel{background:var(--sel)}
.nd.l1{padding-left:24px}.nd .tw{width:12px;color:var(--sub);cursor:pointer;text-align:center}
.nd .nm{overflow:hidden;text-overflow:ellipsis;flex:1}.nd .bd{color:var(--sub);font-size:11px}
.nd.off .nm{color:#5A636B;opacity:.7}
.sw{width:10px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.25)}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent);margin:0}
.empty{padding:14px 12px;color:var(--sub);line-height:1.5}
.split{width:4px;cursor:col-resize;background:transparent;flex:none;margin:0 -2px;z-index:5}.split:hover{background:var(--line)}
/* center */
#center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#tabs{display:flex;background:var(--bar);border-bottom:1px solid var(--line);height:26px;flex:none}
.tab{background:none;border:0;border-right:1px solid var(--line);padding:0 14px;cursor:pointer;color:var(--sub);display:flex;align-items:center;gap:6px}
.tab:hover{background:#E4E1D8}.tab.on{background:var(--panel);color:var(--text);font-weight:600}
.pane{flex:1;min-height:0;display:none;position:relative}.pane.on{display:block}
#p3d{background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3))}
#p2d{background:var(--bg3)}
#cv,#mc{position:absolute;inset:0;touch-action:none;cursor:grab}
.tbx{position:absolute;left:8px;top:8px;display:flex;gap:6px;z-index:3;flex-wrap:wrap;max-width:calc(100% - 300px)}
.tg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.tg button{background:none;border:0;border-right:1px solid var(--line);padding:3px 9px;cursor:pointer;white-space:nowrap}
.tg button:last-child{border:0}.tg button:hover{background:var(--sel)}.tg button.on{background:var(--btn);color:#fff;font-weight:600}
#tip{position:absolute;left:8px;top:40px;background:rgba(28,39,51,.88);color:#fff;padding:3px 9px;border-radius:2px;z-index:3;font-size:11.5px;max-width:60%;pointer-events:none}
#gz{position:absolute;left:8px;bottom:8px;pointer-events:none}
#legend{position:absolute;right:10px;top:10px;min-width:150px;max-width:260px;background:rgba(247,245,240,.94);border:1px solid var(--line);border-radius:2px;z-index:3;font-size:11.5px}
#legend .lh{display:flex;align-items:center;gap:6px;padding:3px 6px;background:var(--bar);cursor:move;font-weight:600;color:var(--sub)}
#legend .lh button{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--sub)}
#legend .li{display:flex;align-items:center;gap:6px;padding:2px 8px}#legend.min .li{display:none}
#nodata{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--sub);text-align:center;line-height:1.7}
#nodata div{background:rgba(247,245,240,.8);padding:14px 22px;border-radius:2px;border:1px dashed var(--line)}
/* table */
#pt{display:none;flex-direction:column;background:var(--panel)}#pt.on{display:flex}
#tbar{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
#tview{flex:1;overflow:auto;position:relative}
#tview table{border-collapse:collapse;position:absolute;left:0;width:max-content;min-width:100%}
#tview th{position:sticky;top:0;background:var(--bar);text-align:left;padding:0 10px;height:22px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-weight:600;z-index:1}
#tview td{padding:0 10px;height:20px;border-bottom:1px solid #E6E2D8;border-right:1px solid #E6E2D8;white-space:nowrap;font-variant-numeric:tabular-nums}
#tview td.n,#tview th.n{text-align:right;color:var(--sub)}
/* konversi */
#pc{display:none;overflow:auto;background:var(--panel)}#pc.on{display:block}
#cgrid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(280px,1.3fr) minmax(250px,1fr);gap:0;min-height:100%}
.cc{border-right:1px solid var(--line);padding:0 0 12px}.cc:last-child{border:0}
.cc .ch{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--line);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.cc .cb{padding:8px 10px}
.row{display:flex;align-items:center;gap:8px;padding:3px 0}.row label{flex:1}
.fr{display:grid;grid-template-columns:110px 1fr;gap:6px 8px;align-items:center;padding:2px 0}
.fr>span{color:var(--sub)}
input[type=text],input[type=number],select{padding:3px 6px;border:1px solid var(--line);border-radius:2px;background:#fff;min-width:0;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:2px;padding:3px 9px;cursor:pointer}.chip:hover{background:var(--sel)}.chip.on{background:var(--sel);border-color:var(--accent);font-weight:600}
.fmt{display:flex;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:2px;margin-bottom:4px;cursor:pointer;background:#fff;align-items:flex-start}
.fmt:hover{background:#F3F1EA}.fmt.on{background:var(--sel);border-color:var(--accent)}
.fmt b{display:block}.fmt small{color:var(--sub)}
.hint{color:var(--sub);font-size:11.5px;line-height:1.5;margin:4px 0 8px}
.plan{border:1px solid var(--line);background:#fff;border-radius:2px;padding:6px 8px;margin:8px 0;font-size:11.5px;line-height:1.5}
.plan .w{color:var(--warn)}.plan .e{color:var(--err)}
.btn{background:var(--btn);color:#fff;border:0;border-radius:2px;padding:6px 14px;cursor:pointer;font-weight:600}.btn:hover{background:var(--btn-h)}.btn:disabled{opacity:.5;cursor:default}
.btn2{background:#fff;border:1px solid var(--line);border-radius:2px;padding:3px 10px;cursor:pointer}.btn2:hover{background:var(--sel)}
/* properti */
#props{flex:1;overflow:auto}
details.sc{border-bottom:1px solid var(--line)}details.sc>summary{padding:4px 8px;background:var(--bar);font-weight:600;cursor:pointer;color:var(--text);list-style:none;display:flex;align-items:center;gap:6px}
details.sc>summary::before{content:"▸";color:var(--sub);font-size:10px}details.sc[open]>summary::before{content:"▾"}
details.sc .sb{padding:6px 10px 8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:3px 8px}.kv>span:nth-child(odd){color:var(--sub)}
.kv input[type=number]{padding:2px 4px}
table.mini{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}table.mini td,table.mini th{padding:1px 4px;text-align:right;border-bottom:1px solid #E6E2D8}table.mini th{color:var(--sub);font-weight:600}table.mini td:first-child,table.mini th:first-child{text-align:left;color:var(--sub)}
.ok{color:#15803D}.warn{color:var(--warn)}.err{color:var(--err)}
/* status */
#sbar{display:flex;align-items:center;gap:16px;background:var(--chrome);color:var(--chrome-t);padding:0 10px;font-size:11px;position:relative}
#sbmsg{cursor:pointer;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#sbmsg .cnt{background:var(--chrome2);border-radius:2px;padding:0 5px;margin-left:6px}
#logpop{position:absolute;left:8px;bottom:26px;width:520px;max-height:320px;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:2px;z-index:70;display:none}
#logpop .lg{padding:4px 10px;border-bottom:1px solid #E6E2D8}#logpop .lg.w{color:var(--warn)}#logpop .lg.e{color:var(--err)}#logpop .lg small{color:var(--sub);margin-right:6px}
#drop{position:fixed;inset:0;background:rgba(28,39,51,.55);display:none;align-items:center;justify-content:center;z-index:100;color:#fff;font-size:18px;pointer-events:none}
#drop.on{display:flex}#drop div{border:2px dashed #fff;padding:40px 70px;border-radius:4px;background:rgba(28,39,51,.5)}
#ctx{position:fixed;z-index:90}
.modal{position:fixed;inset:0;background:rgba(28,39,51,.45);display:flex;align-items:center;justify-content:center;z-index:95}
.modal .mc{background:var(--panel);border:1px solid var(--line);border-radius:2px;width:min(760px,92vw);max-height:86vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;padding:6px 12px;background:var(--bar);border-bottom:1px solid var(--line);font-weight:700}.modal .mh button{margin-left:auto}
.modal .mb2{padding:10px 14px;overflow:auto;line-height:1.5}
.modal table{border-collapse:collapse;width:100%}.modal td,.modal th{padding:3px 8px;border-bottom:1px solid #E6E2D8;text-align:left;vertical-align:top}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.nd.dropa{box-shadow:inset 0 2px 0 var(--accent)}.nd.dropb{box-shadow:inset 0 -2px 0 var(--accent)}.nd[draggable]{cursor:default}
#tview tr.sel td{background:var(--sel)}#tview tbody tr{cursor:default}#tview tbody tr:hover td{background:#F0EDE4}#tview tr.sel:hover td{background:var(--sel)}
#sbcoord{font-variant-numeric:tabular-nums;white-space:nowrap}#sbinfo{white-space:nowrap}
#sbcrs{background:var(--chrome2);color:var(--chrome-t);border:0;border-radius:2px;padding:1px 8px;cursor:pointer;font-size:11px;white-space:nowrap}#sbcrs:hover{filter:brightness(1.25)}
.modal .mc.wide{width:min(1180px,96vw)}.ch2{font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin:6px 0 2px}
.lyo{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}.lyp{background:#8a8f94;padding:12px;display:flex;justify-content:center;border-radius:2px;min-height:300px}.lyp canvas{max-width:100%;max-height:68vh;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.modal .row label{flex:0 1 auto}a{color:var(--accent)}
[data-latar=gelap] #p2d{background:#2A3746}
#menus{display:flex}
#legbody{max-height:46vh;overflow:auto}
.nd.dropin{background:var(--sel);box-shadow:inset 0 0 0 1px var(--accent)}.nd.fd .ic{color:var(--gold)}.nd.fd .tw{width:12px;flex:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-file" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3"/></symbol>

<symbol id="i-line" viewBox="0 0 16 16"><path d="M2 12 6 5l4 5 4-7"/></symbol>
<symbol id="i-tab" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10"/><path d="M2 6.5h12M2 10h12M6.5 3v10"/></symbol>

<symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.5 4.5v8h13v-6.5h-6l-1.5-1.5z"/></symbol>
<symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
<symbol id="i-dock" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
</svg>
<div id="app">
 <div id="mbar"><div id="logo"><b>GP</b>GEO POCKET</div><div id="menus"></div><div id="mright">Peta · digitasi · layout · konversi · offline</div></div>
 <div id="main">
  <aside class="dock" id="left">
   <div class="dh">Project Tree<span class="sp"></span><button id="bfold" title="Folder baru (di dalam folder terpilih bila ada)">＋ Folder</button><button id="bleftc" title="Sembunyikan panel">«</button></div>
   <input id="search" type="text" placeholder="Cari lapisan…" aria-label="Cari lapisan">
   <div id="tree"></div>
  </aside>
  <div class="split" id="sp1"></div>
  <section id="center">
   <div id="tabs">
    <button class="tab on" data-t="2d"><svg class="ic"><use href="#i-map"/></svg>Peta 2D</button>
    <button class="tab" data-t="3d"><svg class="ic"><use href="#i-3d"/></svg>3D</button>
    <button class="tab" data-t="tbl"><svg class="ic"><use href="#i-tab"/></svg>Tabel atribut</button>
    <button class="tab" data-t="conv"><svg class="ic"><use href="#i-conv"/></svg>Konversi</button>
   </div>
   <div class="pane on" id="p2d">
    <canvas id="mc"></canvas>
    <div id="tb2" class="tbx">
     <span class="tg"><button data-tool="pan" title="Geser / pilih (G)">Geser</button><button data-tool="info" title="Info fitur (I)">Info</button></span>
     <span class="tg"><button data-tool="dist" title="Ukur jarak (D)">Jarak</button><button data-tool="area" title="Ukur luas (A)">Luas</button></span>
     <span class="tg"><button data-tool="poly" title="Digit poligon (P)">Poligon</button><button data-tool="line" title="Digit garis (L)">Garis</button><button data-tool="point" title="Digit titik">Titik</button><button data-tool="edit" title="Edit vertex (E)">Edit</button></span>
     <span class="tg"><button data-v="fit" title="Zoom semua (Home)">Zoom semua</button><button data-v="layout" title="Layout peta">Layout</button></span>
    </div>
    <div id="tip"></div>
    <div id="legend"><div class="lh"><span>Legenda</span><button id="legmin" title="Perkecil">–</button></div><div id="legbody"></div></div>
    <div id="nodata"><div>Seret file ke sini atau pakai <b>Berkas → Buka file…</b><br><small>DXF · SHP · TAB · MIF/MID · KML/KMZ · GeoJSON · STR · DTM · MSH · OBJ · CSV · GeoTIFF</small></div></div>
   </div>
   <div class="pane" id="p3d">
    <canvas id="cv"></canvas>
    <div id="tb3" class="tbx"><span class="tg"><button data-v="top">Atas</button><button data-v="front">Depan</button><button data-v="side">Samping</button><button data-v="iso">Iso</button><button data-v="fit">Zoom semua</button><button data-v="ortho" id="bortho">Ortho</button></span></div>
    <canvas id="gz" width="76" height="76"></canvas>
   </div>
   <div class="pane" id="pt"><div id="tbar"></div><div id="tview"></div></div>
   <div class="pane" id="pc"></div>
  </section>
  <div class="split" id="sp2"></div>
  <aside class="dock" id="right">
   <div class="dh">Properti<span class="sp"></span><button id="brightc" title="Sembunyikan panel">»</button></div>
   <div id="props"></div>
  </aside>
 </div>
 <div id="sbar"><div id="sbmsg"></div><div id="sbcoord"></div><div id="sbinfo"></div><button id="sbcrs" title="Sistem koordinat proyek"></button><div id="logpop"></div></div>
</div>
<div id="drop"><div>Lepas file di sini</div></div>

/* ---------- model ---------- */

/* ---------- tabel (CSV / DBF) ---------- */

function parseTable(text){

function guessMap(cols,rows){

function tableToPoints(name,cols,rows,map,src){

function remapPoints(g,map){

function parseDBF(buf,keep){

async function loadFiles(list){
 const all=Array.from(list),vec=[],ras=[],wld={};
 for(const f of all){const x=(f.name.match(/\.([^.]+)$/)||[,''])[1].toLowerCase();if(RASX.test(x))ras.push(f);else if(WLDX.test(x))wld[f.name.replace(/\.[^.]+$/,'').toLowerCase()]=f;else vec.push(f);}
 const first=!S.geoms.length;let added=null;msg('Memuat '+all.length+' file…');await new Promise(r=>setTimeout(r,16));
 const items=[];
 for(const f of vec){try{const buf=await f.arrayBuffer();if(/\.kmz$/i.test(f.name)){const z=await unzip(buf),k=z.find(e=>/\.kml$/i.test(e.name));if(!k)throw new Error('KMZ tidak berisi file KML');items.push({name:f.name.replace(/\.kmz$/i,'.kml'),buf:k.buf,as:f.name});}else items.push({name:f.name,buf:buf});}catch(e){msg(f.name+': '+e.message,'e');}}
 const asName={};items.forEach(i=>{if(i.as)asName[i.name]=i.as;});
 for(const j of GC.groupFiles(items)){j.name=asName[j.name]?j.name:j.name;try{const t0=performance.now(),r=GC.parse(j.name,j.buf,j.aux);r.warn.forEach(w=>msg(w,'w'));
   const fo=r.geoms.length>1?newFolder(j.name,S.selFold&&fById(S.selFold)?S.selFold:null,true):null;if(fo)fo.open=r.geoms.length<=12;
   for(const g of r.geoms.slice().reverse()){if(g.dem)g.dem.cv=demCanvas(g.dem,'hyps');addGeom(g,j.name);if(fo)g.fold=fo.id;postVec(g,j.name);}added=added||r.geoms[0];
   msg('Dimuat '+j.name+': '+r.geoms.length+' lapisan ('+Math.round(performance.now()-t0)+' ms)');}catch(e){msg(j.name+': '+e.message,'e');}}
 for(const f of ras){try{const g=await loadRaster(f,wld[f.name.replace(/\.[^.]+$/,'').toLowerCase()]);addGeom(g,f.name);added=added||g;msg('Dimuat '+f.name+': '+(g.dem?'DEM '+g.dem.nx+' × '+g.dem.ny+' sel':'citra '+nf(g.ras.W)+' × '+nf(g.ras.H)+' piksel, resolusi '+g.ras.px.toFixed(3)+' m'));}catch(e){msg(f.name+': '+e.message,'e');}}

  try{const r=await renderLayout(LY,dpi,true),nm=(LY.title||'peta').replace(/[\\\/:*?"<>|]+/g,'_').trim()||'peta';

   $('#linfo',m).textContent='Selesai: skala 1 : '+nf(r.scale)+', '+dpi+' dpi.';msg('Layout peta '+kind.toUpperCase()+': '+nm+', '+LY.paper+', skala 1:'+nf(r.scale)+', '+dpi+' dpi.');}catch(e){$('#linfo',m).textContent=e.message;msg('Layout: '+e.message,'e');}};
 $('#lpdf',m).onclick=()=>out('pdf');$('#lpng',m).onclick=()=>out('png');}

/* ---------- 3D toolbar, pembagi panel, seret-lepas, tombol ---------- */
$('#tb3').onclick=(e)=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;if(v==='fit')V3.fit();else if(v==='ortho'){V3.setOrtho(!V3.getOrtho());b.classList.toggle('on',V3.getOrtho());}else V3.preset(v);};
(function(){let w=null;const drag=(id,dock,dir)=>{$(id).addEventListener('pointerdown',(e)=>{w={d:$(dock),x:e.clientX,w0:$(dock).offsetWidth,dir:dir};$(id).setPointerCapture(e.pointerId);});
 $(id).addEventListener('pointermove',(e)=>{if(!w||w.d!==$(dock))return;w.d.style.width=Math.max(180,Math.min(560,w.w0+(e.clientX-w.x)*w.dir))+'px';M2.resize();V3.resize();});$(id).addEventListener('pointerup',()=>{w=null;});};drag('#sp1','#left',1);drag('#sp2','#right',-1);})();
let dc=0;const isFileDrag=(e)=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).indexOf('Files')>=0;
addEventListener('dragenter',(e)=>{if(!isFileDrag(e))return;e.preventDefault();dc++;$('#drop').classList.add('on');});addEventListener('dragover',(e)=>{if(isFileDrag(e))e.preventDefault();});
addEventListener('dragleave',(e)=>{if(!isFileDrag(e))return;if(--dc<=0){dc=0;$('#drop').classList.remove('on');}});
addEventListener('drop',(e)=>{if(!isFileDrag(e))return;e.preventDefault();dc=0;$('#drop').classList.remove('on');if(e.dataTransfer.files.length)loadFiles(e.dataTransfer.files);});
$('#fin').onchange=(e)=>{if(e.target.files.length)loadFiles(e.target.files);e.target.value='';};
addEventListener('keydown',(e)=>{const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();$('#fin').click();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo();return;}
 if(typing||$('.modal'))return;
 if(S.tab==='2d'){if(M2.key(e)){e.preventDefault();return;}if(e.key==='Delete'&&delFeature()){e.preventDefault();return;}if(e.key==='Escape'&&M2.tool()!=='pan'){setTool('pan');return;}
  const k={p:'poly',l:'line',e:'edit',d:'dist',a:'area',i:'info',g:'pan'}[e.key.toLowerCase()];if(k&&!e.ctrlKey&&!e.metaKey&&!e.altKey){setTool(k);return;}}
 if(e.key==='Home'){if(S.tab==='3d')V3.fit();else M2.fit();}else if(e.key==='Escape')closeMenus();});
addEventListener('resize',()=>{M2.resize();V3.resize();});
if(window.ResizeObserver){new ResizeObserver(()=>M2.resize()).observe($('#p2d'));new ResizeObserver(()=>V3.resize()).observe($('#p3d'));}

/* ---------- mulai ---------- */
document.documentElement.dataset.palet=store.get('gc_palet','keluarga');document.documentElement.dataset.latar=store.get('gc_latar','hangat');
initMenus();
M2.init($('#mc'),{layers:()=>S.geoms,selected:()=>S.selF,onCursor:onCursor,onPick:onPick,onDigit:onDigit,onView:refineRasters,beforeEdit:(g)=>pushUndo(g,'edit vertex'),onChange:(g)=>changed(g),onMeasure:()=>{}});
try{if(!V3.init($('#cv'),$('#gz')))msg('WebGL tidak tersedia; tab 3D dimatikan, peta 2D dan konversi tetap bisa dipakai.','w');}catch(e){msg('3D gagal: '+e.message,'e');}
M2.resize();setTool('pan');refreshAll();
window.__GC={S:S,C:C,GC:GC,V3:V3,M2:M2,loadFiles:loadFiles,runConvert:runConvert,select:select,showTab:showTab,setTool:setTool,renderLayout:renderLayout,LY:LY,dlgDEM:dlgDEM,dlgLayout:dlgLayout};
</script>
</body>
</html>
