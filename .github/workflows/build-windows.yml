name: Build GC-Ex (Windows 64-bit)

on:
  push:
    branches: [main]
  workflow_dispatch:

# satu build sekaligus: GitHub Release versi yang sama tidak saling timpa di tengah jalan
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # menerbitkan installer ke GitHub Release (repo privat -> release juga privat)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0      # riwayat & tag lengkap: daftar perubahan sejak rilis sebelumnya di catatan rilis

      # ---------- backend Python ----------
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pengaman versi (tolak kenaikan versi aplikasi yang isinya tidak berubah)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/rilis/kemas_rilis.py --cek
          if ($LASTEXITCODE -ne 0) { throw "pengaman versi menolak commit ini - lihat pesan di atas" }
      - name: Pasang paket Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.22.3
      - name: Uji backend
        run: python backend/ci_test.py
      - name: Bangun backend (PyInstaller)
        run: pyinstaller --noconfirm --onedir --name gcex-backend --distpath dist-backend --workpath build-py --collect-submodules uvicorn backend/run_backend.py
      - name: Cek backend hasil build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist-backend/gcex-backend/gcex-backend.exe -ArgumentList "--port","8799" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i=0; $i -lt 40; $i++) { try { $r = Invoke-RestMethod http://127.0.0.1:8799/health; if ($r.ok) { $ok = $true; break } } catch {}; Start-Sleep -Milliseconds 500 }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "backend.exe tidak merespons /health" }
          # DB-Ex: proyek foto + thumbnail (Pillow ikut terbundel) + cek Ollama (tidak ada di server: harus tetap menjawab)
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/foto_core/LTH-1" | Out-Null
          python -c "from PIL import Image; Image.new('RGB',(1200,500),(120,100,80)).save(r'$env:RUNNER_TEMP/foto_core/LTH-1/LTH-1_Box1_0.0-3.5.jpg')"
          $body = @{ folder = "$env:RUNNER_TEMP/foto_core"; by = "CI" } | ConvertTo-Json
          $o = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $body http://127.0.0.1:8799/core/open
          if ($o.scan.total -ne 1) { Stop-Process -Id $p.Id -Force; throw "core/open: foto tidak terbaca" }
          $rows = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $body http://127.0.0.1:8799/core/rows
          $id = $rows.rows[0].id
          $img = Invoke-WebRequest -UseBasicParsing ("http://127.0.0.1:8799/core/img?w=200&id=" + $id + "&folder=" + [uri]::EscapeDataString("$env:RUNNER_TEMP/foto_core"))
          if ($img.Headers["Content-Type"] -notlike "image/jpeg*") { Stop-Process -Id $p.Id -Force; throw "core/img: thumbnail gagal (Pillow?)" }
          $ol = Invoke-RestMethod -Method Post -ContentType "application/json" -Body '{"host":"http://127.0.0.1:11434"}' http://127.0.0.1:8799/core/ollama
          Write-Host ("core OK: hole " + $rows.rows[0].hole_id + ", thumbnail " + $img.RawContentLength + " byte, ollama running=" + $ol.running)
          Stop-Process -Id $p.Id -Force
          Write-Host "backend.exe OK"

      # ---------- Electron + installer ----------
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Pasang paket Node
        run: npm install --no-audit --no-fund
      - name: Kumpulkan lisensi pihak ketiga
        shell: pwsh
        run: |
          python legal/gen_licenses.py legal/LISENSI_PYTHON.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gen_licenses.py gagal (exit $LASTEXITCODE)"; exit 1 }
          # Electron baru tidak lagi mengunduh binary saat npm install: unduh sekarang (perlu LICENSE & LICENSES.chromium.html)
          if (-not (Test-Path node_modules/electron/dist/LICENSE)) { node node_modules/electron/install.js; if ($LASTEXITCODE -ne 0) { Write-Host "::error::unduh binary Electron gagal"; exit 1 } }
          foreach ($p in @(@("node_modules/electron/dist/LICENSE","legal/LISENSI_ELECTRON.txt"),@("node_modules/electron/dist/LICENSES.chromium.html","legal/LISENSI_CHROMIUM.html"))) {
            if (-not (Test-Path $p[0])) { Write-Host ("::error::tidak ada " + $p[0] + "; isi dist: " + ((Get-ChildItem node_modules/electron/dist -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty Name) -join ", ")); exit 1 }
            Copy-Item $p[0] $p[1]
          }
          try { Invoke-WebRequest -UseBasicParsing https://unpkg.com/plotly.js@2.27.0/dist/plotly.min.js.LICENSE.txt -OutFile legal/LISENSI_PLOTLY_BUNDEL.txt } catch { Write-Host "plotly.min.js.LICENSE.txt tidak tersedia: lewati" }
          Get-ChildItem legal | Format-Table Name, Length
      - name: Cek teks syarat penggunaan (halaman lisensi installer)
        run: python -c "b=open('legal/SYARAT_PENGGUNAAN.txt','rb').read(); assert b and all(x < 128 for x in b), 'SYARAT_PENGGUNAAN.txt harus ASCII'; print('OK', len(b))"
      - name: Bangun installer GC-Ex Block Model
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Uji jalan GC-Ex Block Model (fuses, asar, gerbang lisensi)
        shell: pwsh
        run: |
          $exe = "dist/win-unpacked/GC-Ex.exe"; if (-not (Test-Path $exe)) { $exe = (Get-ChildItem dist/win-unpacked/*.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1).FullName }
          $log = Join-Path $env:APPDATA "GC-Ex/logs"; Remove-Item -Recurse -Force $log -ErrorAction SilentlyContinue
          # syarat penggunaan dianggap sudah disetujui (dialog itu diuji manual); yang diuji: aplikasi jalan sampai gerbang lisensi
          $sd = Join-Path $env:APPDATA "GC-Ex"; New-Item -ItemType Directory -Force -Path $sd | Out-Null
          $tv = (Select-String -Path electron/main.js -Pattern "const TERMS_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          Set-Content -Path (Join-Path $sd "settings.json") -Value ('{"termsAccepted":"' + $tv + '"}') -Encoding utf8
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false; for ($i=0; $i -lt 40; $i++) { Start-Sleep -Milliseconds 500; $t = Get-ChildItem $log -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Raw -ErrorAction SilentlyContinue; if ($t -match 'lisensi\] belum aktif') { $ok = $true; break } }
          $alive = -not $p.HasExited
          Get-Process | Where-Object { $_.Path -like "*win-unpacked*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host ($t)
          if (-not $ok -or -not $alive) { Write-Host "::error::GC-Ex Block Model: aplikasi tidak sampai ke jendela aktivasi (alive=$alive)"; exit 1 }
          Write-Host "GC-Ex Block Model: jendela aktivasi lisensi tampil, aplikasi berjalan"
      - name: Cek file lisensi di GC-Ex Block Model
        shell: pwsh
        run: |
          $d = "dist/win-unpacked"
          foreach ($f in @("resources/legal/LISENSI_PIHAK_KETIGA.txt","resources/legal/PENAFIAN_MEREK.txt","resources/legal/SYARAT_PENGGUNAAN.txt","resources/legal/LISENSI_FONT_OFL.txt","resources/legal/LISENSI_PYTHON.txt","resources/legal/LISENSI_ELECTRON.txt","resources/legal/LISENSI_CHROMIUM.html","LICENSE.electron.txt","LICENSES.chromium.html")) {
            if (-not (Test-Path "$d/$f")) { throw "tidak ada: $f" } else { Write-Host ("OK " + $f + " " + (Get-Item "$d/$f").Length) }
          }
      - name: Cek data latihan bawaan di GC-Ex Block Model
        shell: pwsh
        run: |
          $d = "dist/win-unpacked"
          foreach ($f in @("resources/data-latihan/SIM_BM_GC_kadar.csv","resources/data-latihan/SIM_pit_fase1.dxf","resources/data-latihan/SIM_pit_fase2.dxf","resources/data-latihan/SIM_topo_akhir_juni.dxf","resources/data-latihan/SIM_topo_akhir_juli.dxf")) {
            if (-not (Test-Path "$d/$f")) { throw "data latihan tidak ikut terkemas: $f" } else { Write-Host ("OK " + $f + " " + (Get-Item "$d/$f").Length) }
          }
      - name: Bangun installer GC-Ex Drillhole
        run: npm run dist:dh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Uji jalan GC-Ex Drillhole (fuses, asar, gerbang lisensi)
        shell: pwsh
        run: |
          $exe = "dist/win-unpacked/GC-Ex Drillhole.exe"; if (-not (Test-Path $exe)) { $exe = (Get-ChildItem dist/win-unpacked/*.exe | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1).FullName }
          $log = Join-Path $env:APPDATA "GC-Ex Drillhole/logs"; Remove-Item -Recurse -Force $log -ErrorAction SilentlyContinue
          # syarat penggunaan dianggap sudah disetujui (dialog itu diuji manual); yang diuji: aplikasi jalan sampai gerbang lisensi
          $sd = Join-Path $env:APPDATA "GC-Ex Drillhole"; New-Item -ItemType Directory -Force -Path $sd | Out-Null
          $tv = (Select-String -Path electron/main.js -Pattern "const TERMS_VERSION = '([^']+)'").Matches[0].Groups[1].Value
          Set-Content -Path (Join-Path $sd "settings.json") -Value ('{"termsAccepted":"' + $tv + '"}') -Encoding utf8
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false; for ($i=0; $i -lt 40; $i++) { Start-Sleep -Milliseconds 500; $t = Get-ChildItem $log -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Raw -ErrorAction SilentlyContinue; if ($t -match 'lisensi\] belum aktif') { $ok = $true; break } }
          $alive = -not $p.HasExited
          Get-Process | Where-Object { $_.Path -like "*win-unpacked*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host ($t)
          if (-not $ok -or -not $alive) { Write-Host "::error::GC-Ex Drillhole: aplikasi tidak sampai ke jendela aktivasi (alive=$alive)"; exit 1 }
          Write-Host "GC-Ex Drillhole: jendela aktivasi lisensi tampil, aplikasi berjalan"
      - name: Cek file lisensi di GC-Ex Drillhole
        shell: pwsh
        run: |
          $d = "dist/win-unpacked"
          foreach ($f in @("resources/legal/LISENSI_PIHAK_KETIGA.txt","resources/legal/PENAFIAN_MEREK.txt","resources/legal/SYARAT_PENGGUNAAN.txt","resources/legal/LISENSI_FONT_OFL.txt","resources/legal/LISENSI_PYTHON.txt","resources/legal/LISENSI_ELECTRON.txt","resources/legal/LISENSI_CHROMIUM.html","LICENSE.electron.txt","LICENSES.chromium.html")) {
            if (-not (Test-Path "$d/$f")) { throw "tidak ada: $f" } else { Write-Host ("OK " + $f + " " + (Get-Item "$d/$f").Length) }
          }

      - name: Cek data latihan bawaan di GC-Ex Drillhole
        shell: pwsh
        run: |
          $d = "dist/win-unpacked"
          foreach ($f in @("resources/data-latihan/SIM_collar.csv","resources/data-latihan/SIM_survey.csv","resources/data-latihan/SIM_assay.csv","resources/data-latihan/SIM_geologi.csv","resources/data-latihan/SIM_topo_xyz.csv","resources/data-latihan/SIM_BM_GC_kadar.csv","resources/data-latihan/QV_Lensa2_Leapfrog.obj","resources/data-latihan/SIM_pit_fase1.dxf","resources/data-latihan/SIM_topo_akhir_juni.dxf","resources/data-latihan/SIM_topo_akhir_juli.dxf")) {
            if (-not (Test-Path "$d/$f")) { throw "data latihan tidak ikut terkemas: $f" } else { Write-Host ("OK " + $f + " " + (Get-Item "$d/$f").Length) }
          }
      - name: Panduan DB-Ex (HTML)
        run: python docs/md2html.py docs/PANDUAN_CORE.md docs/PANDUAN_CORE.html
      - name: Bangun installer DB-Ex
        run: npm run dist:core
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Cek isi DB-Ex
        shell: pwsh
        run: |
          $d = "dist/win-unpacked"
          foreach ($f in @("resources/legal/LISENSI_PIHAK_KETIGA.txt","resources/legal/LISENSI_PYTHON.txt","resources/legal/SYARAT_PENGGUNAAN.txt","resources/legal/LISENSI_FONT_OFL.txt","resources/legal/PENAFIAN_MEREK.txt","resources/app.asar","resources/docs/PANDUAN_CORE.html","resources/backend/gcex-backend.exe","LICENSE.electron.txt")) {
            if (-not (Test-Path "$d/$f")) { throw "tidak ada: $f" } else { Write-Host ("OK " + $f + " " + (Get-Item "$d/$f").Length) }
          }

      # SETIAP build di main menerbitkan GitHub Release v<versi> (privat, tidak memakan kuota artifact Actions) berisi:
      # 3 installer terpisah, dokumen (panduan teknis & tutorial), data latihan dummy, lisensi & tentang, catatan rilis
      # (daftar commit sejak rilis sebelumnya) dan SHA256SUMS; kode sumber zip/tar.gz otomatis dari tag.
      # Aplikasi TIDAK membaca release ini (tanpa auto-update); admin mengunduh lalu mengirim ke pelanggan.
      # ---------- DB-Ex Qt (PySide6): uji, bangun, uji jalan, installer NSIS ----------
      - name: DB-Ex Qt - pasang PySide6 & uji pytest-qt
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install PySide6-Essentials==6.8.1.1 pytest-qt==4.4.0 -r backend/requirements-vision.txt
          # model ONNX (SAM & Depth Anything, Apache-2.0) dari Hugging Face pada revisi tetap, dicek SHA256 -> models/ (ikut installer)
          python tools/ai_models/unduh_model.py models
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::unduh model AI gagal - uji SAM / Depth Anything dilewati" }
          python -m pytest -q -rfE --tb=line -p no:cacheprovider app_core_qt/tests backend/tests/test_core_forms.py backend/tests/test_core_qaqc.py backend/tests/test_core_ocanalisis.py backend/tests/test_core_oclokasi.py backend/tests/test_core_oc3d.py 2>&1 | Tee-Object -FilePath qt_test.log
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Select-String -Path qt_test.log -Pattern 'FAILED|ERROR|Error|assert|Exception|File "' | Select-Object -First 50 | ForEach-Object { Write-Host ("::warning::qt-test " + $_.Line.Trim()) }
            Write-Host "::warning::uji DB-Ex Qt gagal (exit $rc) - lanjut untuk diagnosis build"
          }
          # WAJIB: tanpa exit 0, GitHub menambahkan "exit $LASTEXITCODE" di akhir skrip, sehingga langkah ini
          # tetap GAGAL walau sudah ditangani di atas -> job berhenti dan langkah Release dilewati
          # (Release 0.23.4 & 0.23.5 tidak terbit karena ini). Hasil uji tetap terlihat sebagai ::warning::.
          exit 0
      - name: DB-Ex Qt - bangun (PyInstaller)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # DB-Ex Qt masih tahap percobaan: installer rilis tetap versi Electron. Karena itu
          # kegagalan di sini TIDAK boleh menahan Release GC-Ex - ditandai lalu dilewati.
          trap {
            Write-Host ("::warning::build DB-Ex Qt gagal: " + $_.Exception.Message)
            Write-Host "::warning::langkah DB-Ex Qt berikutnya dilewati; Release GC-Ex tetap jalan"
            "QT_BUILD=gagal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $v = (Get-Content builder-core.json -Raw | ConvertFrom-Json).extraMetadata.version
          Set-Content -Path app_core_qt/version.txt -Value $v -NoNewline -Encoding ascii
          pyinstaller --noconfirm --onedir --windowed --name DB-Ex --icon build/icon-core.ico --paths backend --paths app_core_qt `
            --add-data "app-core/fonts;fonts" --add-data "app_core_qt/version.txt;." --add-data "build/icon-core.ico;." `
            --add-data "models;models" --hidden-import cv2 --hidden-import onnxruntime --hidden-import shapely --hidden-import shapely.geometry --hidden-import pypdfium2 --collect-all pypdfium2 --collect-all pypdfium2_raw `
            --hidden-import matplotlib --hidden-import matplotlib.backends.backend_agg --collect-data matplotlib --hidden-import openpyxl.drawing.image `
            --collect-binaries onnxruntime --exclude-module sympy --exclude-module mpmath `
            --exclude-module tkinter --exclude-module uvicorn --distpath dist-qt --workpath build-pyqt app_core_qt/main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller DB-Ex Qt gagal" }
          # Teks lisensi GNU diambil dari gnu.org. Satu gangguan jaringan dulu menggagalkan SELURUH
          # rilis, jadi: coba 3x, lalu ambil salinan dari rilis sebelumnya (selalu terjangkau dari
          # runner), baru menyerah. Teksnya tidak pernah diubah - hanya disalin.
          foreach ($n in @("lgpl-3.0","gpl-3.0")) {
            $f = if ($n -eq "lgpl-3.0") { "legal/LISENSI_QT_LGPL-3.0.txt" } else { "legal/LISENSI_QT_GPL-3.0.txt" }
            $ok = $false
            for ($i = 1; $i -le 3 -and -not $ok; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing ("https://www.gnu.org/licenses/" + $n + ".txt") -OutFile $f -TimeoutSec 40
                if ((Test-Path $f) -and (Get-Item $f).Length -ge 5000) { $ok = $true; break }
              } catch { Write-Host ("::warning::gnu.org coba-$i " + $_.Exception.Message) }
              Start-Sleep -Seconds 10
            }
            if (-not $ok) {
              Write-Host "::warning::gagal mengambil $n dari gnu.org - mencoba salinan dari rilis sebelumnya"
              $tag = gh release list -R $env:GITHUB_REPOSITORY --limit 20 --json tagName,isPrerelease --jq '[.[]|select(.isPrerelease==false)][0].tagName'
              if ($tag) {
                $tmp = Join-Path $env:RUNNER_TEMP "lis"
                New-Item -ItemType Directory -Force $tmp | Out-Null
                gh release download $tag -R $env:GITHUB_REPOSITORY -p "*_3_Lisensi-dan-Tentang.zip" -D $tmp --clobber
                $z = Get-ChildItem $tmp -Filter *.zip | Select-Object -First 1
                if ($z) {
                  Expand-Archive $z.FullName -DestinationPath "$tmp/x" -Force
                  $src = Get-ChildItem "$tmp/x" -Recurse -Filter ([System.IO.Path]::GetFileName($f)) | Select-Object -First 1
                  if ($src -and $src.Length -ge 5000) { Copy-Item $src.FullName $f -Force; $ok = $true
                    Write-Host "::notice::teks $n diambil dari rilis $tag" }
                }
              }
            }
            if (-not $ok) { throw "teks lisensi $n tidak dapat diperoleh (gnu.org maupun rilis sebelumnya)" }
          }
          $d = "dist-qt/DB-Ex"
          New-Item -ItemType Directory -Force "$d/legal","$d/docs" | Out-Null
          Get-ChildItem legal -File | Where-Object { $_.Extension -in ".txt",".html" -and $_.Name -notin @("LISENSI_ELECTRON.txt","LISENSI_CHROMIUM.html","LISENSI_PLOTLY_BUNDEL.txt") } | Copy-Item -Destination "$d/legal"
          Copy-Item docs/PANDUAN_CORE.html "$d/docs"
          Get-ChildItem $d | Format-Table Name, Length
          "{0:N1} MB" -f ((Get-ChildItem $d -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          exit 0
      - name: DB-Ex Qt - uji mandiri exe (backend, Pillow, Excel, font) & gerbang lisensi
        shell: pwsh
        run: |
          if ($env:QT_BUILD -eq 'gagal') { Write-Host "::warning::dilewati: build DB-Ex Qt gagal"; exit 0 }
          $exe = "dist-qt/DB-Ex/DB-Ex.exe"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/qt_core/LTH-1" | Out-Null
          python -c "from PIL import Image; Image.new('RGB',(1200,500),(120,100,80)).save(r'$env:RUNNER_TEMP/qt_core/LTH-1/LTH-1_Box1_0.0-3.5.jpg')"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest","$env:RUNNER_TEMP/qt_core","$env:RUNNER_TEMP/qt_self.json" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP/qt_self.json" -Raw | Write-Host
          if ($p.ExitCode -ne 0) { throw "uji mandiri DB-Ex Qt gagal (exit $($p.ExitCode))" }
          $sd = Join-Path $env:APPDATA "DB-Ex"; New-Item -ItemType Directory -Force -Path $sd | Out-Null
          $tv = (Select-String -Path app_core_qt/corex/dialogs.py -Pattern 'TERMS_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path (Join-Path $sd "settings.json") -Value ('{"termsAccepted":"' + $tv + '"}') -Encoding utf8
          $log = Join-Path $sd "logs"; Remove-Item -Recurse -Force $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false; for ($i=0; $i -lt 60; $i++) { Start-Sleep -Milliseconds 500; $t = Get-ChildItem $log -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Raw -ErrorAction SilentlyContinue; if ($t -match 'lisensi\] belum aktif') { $ok = $true; break } }
          $alive = -not $p.HasExited
          # satu jendela: DB-Ex kedua meneruskan folder ke jendela pertama lalu selesai sendiri
          $p2 = Start-Process -FilePath $exe -ArgumentList "--folder","$env:RUNNER_TEMP/qt_core" -PassThru
          $null = $p2.Handle  # agar ExitCode terbaca setelah WaitForExit
          $one = $p2.WaitForExit(20000) -and $p2.ExitCode -eq 0
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Milliseconds 800
          $t = Get-ChildItem $log -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Raw -ErrorAction SilentlyContinue
          $one = $one -and ($t -match 'pesan dari DB-Ex kedua') -and -not $p.HasExited
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host $t
          if (-not $ok -or -not $alive) { Write-Host "::error::DB-Ex Qt tidak sampai ke jendela aktivasi (alive=$alive)"; exit 1 }
          # peringatan saja (installer Qt belum dirilis): tidak menghentikan rilis Block Model / Drillhole / DB-Ex Electron
          if (-not $one) { Write-Host "::warning::DB-Ex Qt kedua tidak meneruskan ke jendela pertama (satu jendela) - periksa log di atas" }
          else { Write-Host "DB-Ex Qt: DB-Ex kedua diteruskan ke jendela pertama (satu jendela)" }
          Write-Host "DB-Ex Qt: jendela aktivasi lisensi tampil, aplikasi berjalan"
      - name: DB-Ex Qt - installer (NSIS) & uji pasang / copot
        shell: pwsh
        run: |
          if ($env:QT_BUILD -eq 'gagal') { Write-Host "::warning::dilewati: build DB-Ex Qt gagal"; exit 0 }
          $v = (Get-Content builder-core.json -Raw | ConvertFrom-Json).extraMetadata.version
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { foreach ($c in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")) { if (Test-Path $c) { $mk = $c; break } } }
          if (-not $mk) { choco install nsis -y --no-progress | Out-Null; foreach ($c in @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe")) { if (Test-Path $c) { $mk = $c; break } } }
          if (-not $mk) { throw "makensis tidak ditemukan" }
          Write-Host "makensis: $mk"
          $out = "$PWD\dist-qt\DB-Ex-Qt-Setup-$v.exe"
          & $mk /V2 "/DVERSION=$v" "/DSRC=$PWD\dist-qt\DB-Ex" "/DOUT=$out" "/DROOT=$PWD" tools\corex_qt\installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis gagal" }
          $p = Start-Process -FilePath $out -ArgumentList "/S" -PassThru -Wait
          $inst = Join-Path $env:LOCALAPPDATA "Programs\DB-Ex"
          foreach ($f in @("DB-Ex.exe","Uninstall DB-Ex.exe","legal/LISENSI_QT_LGPL-3.0.txt","legal/SYARAT_PENGGUNAAN.txt","docs/PANDUAN_CORE.html","_internal/fonts/Inter-Variable.ttf")) {
            if (-not (Test-Path "$inst/$f")) { throw "installer: tidak ada $f" } else { Write-Host "OK $f" }
          }
          Start-Process -FilePath "$inst\Uninstall DB-Ex.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "$inst\DB-Ex.exe") { throw "uninstaller tidak menghapus DB-Ex.exe" }
          Write-Host ("installer OK: " + [math]::Round((Get-Item $out).Length / 1MB, 1) + " MB")
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: DB-Ex-Qt-Setup-Windows
          path: dist-qt/DB-Ex-Qt-Setup-*.exe
          retention-days: 7
      # installer uji DB-Ex Qt juga ke pre-release "core-ex-qt-uji" (privat, tidak memakai kuota artifact Actions yang
      # bisa penuh). Hanya installer terbaru yang disimpan. Bukan rilis resmi: Release v<versi> tetap berisi DB-Ex Electron.
      - name: DB-Ex Qt - unggah installer uji ke pre-release core-ex-qt-uji
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-ChildItem dist-qt -Filter "DB-Ex-Qt-Setup-*.exe" | Select-Object -First 1
          if (-not $f) { Write-Host "::warning::installer DB-Ex Qt tidak ada, pre-release tidak diperbarui"; exit 0 }
          $t = "core-ex-qt-uji"
          gh release view $t -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $t -R $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title "DB-Ex Qt (installer uji, bukan rilis resmi)" `
              --notes "Installer uji DB-Ex versi Qt (PySide6) dari build terakhir main. Untuk dicoba sebelum DB-Ex 1.0.0; Release v<versi> resmi masih memuat DB-Ex versi Electron."
          }
          $old = gh release view $t -R $env:GITHUB_REPOSITORY --json assets --jq ".assets[].name" | Where-Object { ($_ -like "DB-Ex-Qt-Setup-*.exe" -or $_ -like "Core-Ex-Qt-Setup-*.exe") -and $_ -ne $f.Name }
          foreach ($o in $old) { gh release delete-asset $t $o -R $env:GITHUB_REPOSITORY --yes }
          gh release upload $t $f.FullName -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gagal mengunggah $($f.Name) ke pre-release $t"; exit 0 }
          Write-Host "::notice::installer uji $($f.Name) tersedia di pre-release $t"
          exit 0

      # ---------- tutorial PDF ----------
      # Dibangun di runner Windows supaya ikut terbit tiap rilis. Dua tutorial bergambar memerlukan
      # tangkapan layar aplikasi (Chromium membuka folder proyek lewat File System Access API) -
      # itulah sebabnya langkah ini tidak dapat dijalankan di kontainer Linux. Tutorial tambahan 0.24
      # tidak memerlukan tangkapan layar dan selalu dibangun.
      - name: Tutorial PDF - pasang alat
        if: github.ref == 'refs/heads/main'
        run: |
          pip install playwright==1.48.0 matplotlib==3.9.2 pillow
          python -m playwright install chromium
      - name: Tutorial PDF - data latihan simulasi
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python docs/tutorial-gcex/make_sim_data.py docs/tutorial-gcex/data
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gagal membuat data latihan vein"; }
          python docs/tutorial-gcex/make_sim_laterit.py docs/tutorial-gcex/data
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gagal membuat data latihan laterit"; }
          exit 0
      - name: Tutorial PDF - Update & Petunjuk Teknis (tanpa tangkapan layar)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          foreach ($b in @("build_tutorial_update.py","build_petunjuk_teknis.py")) {
            python ("docs/tutorial-gcex/src/" + $b) 2>&1 | Tee-Object -FilePath tutdoc.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content tutdoc.log -Tail 14 | ForEach-Object { Write-Host ("::error::tutdoc " + $_) }
              throw ("gagal membangun " + $b)
            }
          }
          exit 0
      - name: Tutorial PDF - bergambar (tangkapan layar aplikasi)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        timeout-minutes: 40
        run: |
          # Tiap tahap boleh gagal tanpa menggagalkan rilis: bila tangkapan layar tidak jadi, PDF lama
          # yang ada di repo tetap dipakai. Kegagalannya tampil sebagai ::warning:: di ringkasan run.
          function Tahap($nama, $cmd) {
            Write-Host "== $nama"
            & cmd /c "$cmd 2>&1" | Tee-Object -FilePath "tut.log"
            if ($LASTEXITCODE -ne 0) {
              # GitHub hanya menampilkan 10 anotasi peringatan per langkah, jadi jangan buang jatahnya
              # untuk 30 baris terakhir yang biasanya hanya jejak Playwright. Ambil yang menjelaskan:
              # baris pengecualian terakhir + konteks berkas/baris di sekitarnya.
              $L = Get-Content tut.log
              $pick = @()
              # Pengecualian Playwright berbentuk 'playwright._impl._errors.Error: ...', jadi polanya
              # tidak boleh mengharuskan baris DIMULAI kata-Error. Cari di mana pun dalam baris.
              $exc = $L | Select-String -Pattern '(Error|Exception)\b[^:]*:' | Select-Object -Last 4
              $loc = $L | Select-String -Pattern 'File ".*", line \d+' | Select-Object -Last 2
              $pes = $L | Select-String -Pattern 'Call log|waiting for|Timeout .*exceeded' | Select-Object -Last 2
              $jjk = $L | Select-String -Pattern '^(GAGAL setelah gambar|catatan terakhir)' | Select-Object -Last 2
              $pick += $loc | ForEach-Object { $_.Line.Trim() }
              $pick += $pes | ForEach-Object { $_.Line.Trim() }
              $pick += $jjk | ForEach-Object { $_.Line.Trim() }
              $pick += $exc | ForEach-Object { $_.Line.Trim() }
              if (-not $pick) { $pick = ($L | Select-Object -Last 6) }
              $pick | Select-Object -Last 8 | ForEach-Object { Write-Host ("::warning::tutorial " + $_) }
              Write-Host "::warning::$nama gagal - PDF lama di repo tetap dipakai"
              # log penuh ke ringkasan run (tanpa batas 10 baris)
              # pagar kode ditulis dengan kutip tunggal: backtick di string kutip ganda adalah karakter escape PowerShell
              ('### Galat ' + $nama + "`n`n" + '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              ($L | Select-Object -Last 60) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              return $false
            }
            return $true
          }
          $a = Tahap "tangkapan layar Drill Hole" "python docs\tutorial-gcex\src\tutorial_shots.py"
          if ($a) {
            # gambar 'validasi_rusak' (database dengan kesalahan sengaja) dipakai build_tutorial.py
            Tahap "tangkapan layar database rusak" "python docs\tutorial-gcex\src\shot_rusak.py" | Out-Null
            $b = Tahap "tangkapan layar laterit" "python docs\tutorial-gcex\src\tutorial_lat_shots.py"
            if ($b) { Tahap "susun PDF Modelling & Estimasi" "python docs\tutorial-gcex\src\build_tutorial.py" | Out-Null }
          }
          $c = Tahap "tangkapan layar Block Model" "python docs\tutorial-gcex\src\tutorial_bm_shots.py"
          if ($c) { Tahap "susun PDF Block Model" "python docs\tutorial-gcex\src\build_tutorial_bm.py" | Out-Null }
          exit 0
      - name: Tutorial PDF - daftar hasil
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Get-ChildItem docs/tutorial-gcex/*.pdf, docs/*.pdf -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("::notice::PDF " + $_.Name + " " + [math]::Round($_.Length/1MB,2) + " MB " + $_.LastWriteTime) }
          exit 0

      - name: Kemas & terbitkan GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          # versi per aplikasi: package.json (Block Model), builder-dh.json / builder-core.json extraMetadata.version (bila ada)
          $vs = @((Get-Content package.json -Raw | ConvertFrom-Json).version)
          foreach ($b in @('builder-dh.json','builder-core.json')) { $x = (Get-Content $b -Raw | ConvertFrom-Json).extraMetadata.version; if ($x) { $vs += $x } }
          $v = ($vs | Sort-Object { [version]$_ } -Descending | Select-Object -First 1)
          Write-Host ("versi aplikasi: " + ($vs -join ', ') + " -> rilis v" + $v)
          $tag = "v$v"
          python docs/tutorial-core/buat_data_dummy.py build-rel/DB-Ex_Data_Dummy
          if ($LASTEXITCODE -ne 0) { throw "gagal membuat data dummy DB-Ex" }
          python tools/rilis/kemas_rilis.py $v dist rilis build-rel/DB-Ex_Data_Dummy 2>&1 | Tee-Object -FilePath kemas.log
          if ($LASTEXITCODE -ne 0) { Get-Content kemas.log -Tail 12 | ForEach-Object { Write-Host ("::error::kemas " + $_) }; throw "gagal mengemas rilis" }
          $files = @(Get-ChildItem rilis -File | ForEach-Object { $_.FullName })
          # Release TIDAK dihapus lebih dulu. Dulu langkah ini menghapus Release lama lalu membuatnya
          # kembali; bila run dibatalkan / gagal di ANTARA dua langkah itu, repo ditinggalkan TANPA
          # rilis sama sekali. Itu benar-benar terjadi 4 Nov 2026: beberapa sesi mendorong beruntun,
          # run yang sedang menerbitkan disalip dan dibatalkan sesudah penghapusan, dan v0.36.1
          # (berisi installer GC-Ex 0.24.24 + Block Model 0.24.23) lenyap.
          # Sekarang tag dipindahkan ke commit ini tanpa menyentuh Release-nya, lalu isinya
          # diperbarui di tempat. Pada titik mana pun Release selalu ada.
          $cr = "rilis/GC-Ex-${v}_CATATAN_RILIS.md"
          git tag -f $tag $env:GITHUB_SHA
          git push -f origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::gagal memindahkan tag $tag - arsip kode sumber rilis bisa tertinggal di commit lama" }
          # coba sampai 3x: satu kali gangguan jaringan saat mengunggah installer besar dulu langsung
          # menggagalkan langkah ini tanpa pesan (Release 0.23.3 tidak terbit)
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -ne 0) {
              $o = gh release create $tag @files --target $env:GITHUB_SHA --title "GC-Ex $v" --notes-file $cr 2>&1
            } else {
              # Release sudah ada: perbarui judul & catatan, lalu timpa berkasnya (--clobber)
              $o = gh release edit $tag --title "GC-Ex $v" --notes-file $cr 2>&1
              if ($LASTEXITCODE -eq 0) { $o = gh release upload $tag @files --clobber 2>&1 }
            }
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            $o | Select-Object -Last 10 | ForEach-Object { Write-Host ("::warning::gh coba-$i " + $_) }
            if ($o -match "403" -or $o -match "not accessible by integration") {
              # bukan gangguan jaringan: token GITHUB_TOKEN tidak punya izin tulis -> mencoba ulang tidak ada gunanya
              Write-Host "::error::GITHUB_TOKEN tidak boleh membuat Release (HTTP 403). Buka Settings > Actions > General > Workflow permissions di repo ini dan pilih 'Read and write permissions', lalu jalankan ulang build. Workflow sudah meminta contents: write, jadi batasnya ada di pengaturan repo."
              break
            }
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { $o | Select-Object -Last 10 | ForEach-Object { Write-Host ("::error::gh " + $_) }; throw "gagal membuat release $tag setelah 3 percobaan" }
          # pastikan semua file benar-benar ada di Release (unggahan bisa gagal sebagian)
          $ada = @(gh release view $tag --json assets --jq '.assets[].name')
          $kurang = @($files | ForEach-Object { Split-Path $_ -Leaf } | Where-Object { $ada -notcontains $_ })
          if ($kurang) { Write-Host ("::error::gh file belum terunggah: " + ($kurang -join ', ')); throw "release $tag tidak lengkap" }
          # buang aset lama yang tidak lagi diproduksi run ini (mis. installer versi sebelumnya),
          # dikerjakan SESUDAH semua berkas baru dipastikan ada supaya rilis tidak pernah kosong
          $nama = @($files | ForEach-Object { Split-Path $_ -Leaf })
          foreach ($a in $ada) {
            if ($nama -notcontains $a) {
              gh release delete-asset $tag $a --yes
              if ($LASTEXITCODE -eq 0) { Write-Host ("::notice::aset lama dibuang: " + $a) }
            }
          }
          exit 0

      # Artifact Actions = cadangan jangka pendek saja; sumber resmi installer adalah GitHub Release.
      # Retensi 2 hari (dulu 7): tiap push mengunggah tiga installer 144-200 MB, dan dengan beberapa push per hari
      # kuota penyimpanan artifact (yang dihitung GB-hari) penuh sehingga unggahan ditolak. 2 hari cukup untuk
      # mengambil installer sebuah run yang baru saja selesai, dan memangkas pemakaian kuota sekitar 70%.
      # Kegagalan unggah tetap tidak menggagalkan build (continue-on-error), karena installer sudah ada di Release.
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: GC-Ex-Setup-Windows
          path: dist/GC-Ex-Setup-*.exe
          retention-days: 2
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: GC-Ex-Drillhole-Setup-Windows
          path: dist/GC-Ex-Drillhole-Setup-*.exe
          retention-days: 2
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: DB-Ex-Setup-Windows
          path: dist/DB-Ex-Setup-*.exe
          retention-days: 2

      # audit keamanan (informasi, tidak menggagalkan build): environment Python terpisah supaya tidak ikut ke daftar lisensi
      - name: Audit keamanan paket (Node & Python)
        if: always()
        shell: pwsh
        run: |
          $j = npm audit --json 2>$null | Out-String
          try { $o = $j | ConvertFrom-Json; $v = $o.metadata.vulnerabilities; Write-Host ("npm audit: critical=" + $v.critical + " high=" + $v.high + " moderate=" + $v.moderate + " low=" + $v.low)
            if (($v.critical + $v.high + $v.moderate) -gt 0) { $o.vulnerabilities.PSObject.Properties | ForEach-Object { Write-Host ("::warning::npm " + $_.Name + " (" + $_.Value.severity + ")") } } } catch { Write-Host "npm audit tidak terbaca" }
          python -m venv .audit
          .audit/Scripts/python -m pip install -q pip-audit
          .audit/Scripts/python -m pip_audit -r backend/requirements.txt -f json -o audit_py.json; $null = $LASTEXITCODE
          if (Test-Path audit_py.json) { python -c "import json;d=json.load(open('audit_py.json'));[print('::warning::pip '+x['name']+' '+x['version']+' '+v['id']+' fix '+(','.join(v.get('fix_versions') or ['-']))) for x in d.get('dependencies',[]) for v in x.get('vulns',[])];print('pip-audit selesai')" }
          exit 0

