name: Dev wheels (Linux, untuk pengembangan Core-Ex Qt)

# Hanya dijalankan manual. Mengunduh wheel PySide6 + pytest-qt untuk lingkungan pengembangan Linux (Python 3.13)
# lalu menaruhnya di pre-release "dev-wheels" (privat). Tidak dipakai pengguna akhir.
on:
  workflow_dispatch:

jobs:
  wheels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Unduh wheel
        run: |
          mkdir wh
          pip download PySide6-Essentials==6.8.1.1 shiboken6==6.8.1.1 pytest-qt==4.4.0 --only-binary=:all: \
            --platform manylinux_2_28_x86_64 --python-version 3.13 --implementation cp -d wh
          ls -la wh
      - name: Terbitkan ke pre-release dev-wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-wheels -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dev-wheels -R "$GITHUB_REPOSITORY" --prerelease --title "Dev wheels (bukan rilis aplikasi)" \
              --notes "Wheel PySide6 untuk pengembangan Core-Ex Qt di Linux. Bukan rilis aplikasi." --target main
          gh release upload dev-wheels wh/*.whl -R "$GITHUB_REPOSITORY" --clobber
